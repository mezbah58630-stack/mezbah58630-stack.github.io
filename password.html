<!DOCTYPE html>
<html>
<head>
<title>Password Generator</title>
<style>
body{text-align:center;font-family:Arial;background:#111;color:white;padding-top:40px;}
.box{background:white;color:black;max-width:400px;margin:auto;padding:30px;border-radius:15px;}
input{width:90%;padding:15px;font-size:18px;text-align:center;border:2px solid #ddd;border-radius:10px;margin:15px 0;}
button{padding:15px 25px;font-size:18px;border:none;border-radius:10px;cursor:pointer;color:white;margin:5px;}
.gen{background:#9c27b0;}
.copy{background:#4caf50;}
.back{background:white;color:black;padding:10px 20px;border-radius:10px;text-decoration:none;display:inline-block;margin-top:20px;}
</style>
</head>
<body>

<h2>🔐 Password Generator</h2>
<div class="box">
<p>Click Generate to create a strong password!</p>
<input type="text" id="pass" readonly placeholder="Your password will appear here">
<br>
<button class="gen" onclick="generate()">Generate 🔄</button>
<button class="copy" onclick="copyPass()">Copy 📋</button>
<p id="msg"></p>
</div>

<br>
<a class="back" href="index.html">⬅ Back to Home</a>

<script>
function generate(){
  let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
  let password = "";
  for(let i=0; i<12; i++){
    password += chars.charAt(Math.floor(Math.random()*chars.length));
  }
  document.getElementById("pass").value = password;
  document.getElementById("msg").innerText = "";
}
function copyPass(){
  let p = document.getElementById("pass");
  if(!p.value){ document.getElementById("msg").innerText = "First Generate a password!"; return; }
  p.select();
  document.execCommand("copy");
  document.getElementById("msg").innerText = "✅ Copied!";
}
</script>

</body>
</html>
