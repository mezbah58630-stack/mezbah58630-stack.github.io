<!DOCTYPE html>
<html>
<head>
<title>My To-Do List 📝</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{ font-family: Arial, sans-serif; background: #f0f2f5; text-align: center; margin: 0; padding: 20px; }
h1{ color: #333; }
.todo-box{ background: white; max-width: 400px; margin: 20px auto; padding: 25px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); }
input{ width: 70%; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 10px; }
#addBtn{ padding: 12px 18px; font-size: 16px; background: #4caf50; color: white; border: none; border-radius: 10px; cursor: pointer; }
ul{ list-style: none; padding: 0; text-align: left; }
li{ background: #f9f9f9; padding: 12px; margin: 8px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 17px; }
li.done{ text-decoration: line-through; color: #888; background: #e8f5e9; }
li button{ background: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
a{ display: inline-block; margin-top: 20px; background: #333; color: white; padding: 10px 20px; border-radius: 10px; text-decoration: none; }
body.dark{ background: #1a1a1a; }
body.dark h1{ color: white; }
body.dark .todo-box{ background: #2d2d2d; }
body.dark li{ background: #444; color: white; }
body.dark li.done{ background: #2e4a2e; color: #aaa; }
</style>
</head>
<body>

<h1>My To-Do List 📝</h1>
<button onclick="document.body.classList.toggle('dark')" style="padding:10px 20px;border-radius:10px;cursor:pointer;">🌙 Dark Mode</button>

<div class="todo-box">
<input type="text" id="taskInput" placeholder="Add new task...">
<button id="addBtn" onclick="addTask()">Add +</button>
<ul id="taskList"></ul>
<p id="count">Total Tasks: 0</p>
<button onclick="clearAll()" style="padding:10px 20px;border-radius:10px;background:#f44336;color:white;border:none;cursor:pointer;">🗑️ Clear All</button>
</div>

<a href="index.html">⬅ Back to Home</a>

<script>
function addTask(){
  let input = document.getElementById('taskInput');
  let text = input.value.trim();
  if(text === ''){ alert('Please write a task!'); return; }
  let li = document.createElement('li');
  li.innerHTML = `<span onclick="this.parentElement.classList.toggle('done')" style="cursor:pointer;flex:1;">${text}</span> <button onclick="this.parentElement.remove(); updateCount();">❌</button>`;
  document.getElementById('taskList').appendChild(li);
  input.value = '';
  updateCount();
}
function updateCount(){
  let total = document.getElementById('taskList').children.length;
  document.getElementById('count').innerText = 'Total Tasks: ' + total;
}
function clearAll(){
  document.getElementById('taskList').innerHTML = '';
  updateCount();
}
document.getElementById('taskInput').addEventListener('keypress', function(e){
  if(e.key === 'Enter'){ addTask(); }
});
</script>

</body>
</html>
