<!DOCTYPE html>
<html>
<head>
<title>Rock Paper Scissors - Mezbah</title>
<style>
body{font-family:Arial;text-align:center;background:#fff3e0;padding:20px}
.box{background:white;max-width:400px;margin:auto;padding:20px;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.2)}
button{font-size:50px;margin:10px;padding:10px;border:none;border-radius:15px;background:#f5f5f5;cursor:pointer}
button:active{background:#ffe0b2}
#result{font-size:22px;font-weight:bold;margin:15px}
#score{font-size:18px;color:#333}
a{color:#ff9800}
</style>
</head>
<body>
<div class="box">
<h2>🎮 Rock Paper Scissors</h2>
<p>Choose one:</p>
<button onclick="play('✊')">✊</button>
<button onclick="play('✋')">✋</button>
<button onclick="play('✌️')">✌️</button>
<div id="result">Good Luck, Mezbah!</div>
<div id="score">You: 0 | Computer: 0</div>
<br>
<a href="index.html">← Back to Home</a>
<p>Made by Mezbah</p>
</div>
<script>
let myScore=0, compScore=0;
function play(user){
let choices=['✊','✋','✌️'];
let comp=choices[Math.floor(Math.random()*3)];
let res="";
if(user==comp) res="Draw! 🤝";
else if((user=='✊'&&comp=='✌️')||(user=='✋'&&comp=='✊')||(user=='✌️'&&comp=='✋')){res="You Win! 🎉";myScore++;}
else{res="Computer Wins! 😢";compScore++;}
document.getElementById('result').innerText="You: "+user+" Computer: "+comp+" - "+res;
document.getElementById('score').innerText="You: "+myScore+" | Computer: "+compScore;
}
</script>
</body>
</html>
