<!DOCTYPE html>
<html>
<head>
<title>My Calculator 🧮</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  text-align: center;
  margin: 0;
  padding: 20px;
}
h1{ color: #333; }
.calc-box{
  background: white;
  max-width: 320px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}
#display{
  width: 100%;
  height: 60px;
  font-size: 28px;
  text-align: right;
  padding: 10px;
  box-sizing: border-box;
  border: 2px solid #ddd;
  border-radius: 10px;
  margin-bottom: 15px;
  background: #f9f9f9;
}
.buttons{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
button{
  height: 55px;
  font-size: 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #e9e9e9;
}
button:hover{ background: #d5d5d5; }
.green{ background: #ff9800; color: white; }
.green:hover{ background: #f57c00; }
.blue{ background: #2196f3; color: white; }
.blue:hover{ background: #1976d2; }
.red{ background: #f44336; color: white; }
.red:hover{ background: #d32f2f; }
a{
  display: inline-block;
  margin-top: 20px;
  background: #333;
  color: white;
  padding: 10px 20px;
  border-radius: 10px;
  text-decoration: none;
}
body.dark{ background: #1a1a1a; }
body.dark h1{ color: white; }
body.dark .calc-box{ background: #2d2d2d; }
body.dark #display{ background: #444; color: white; border-color: #555; }
body.dark button{ background: #444; color: white; }
</style>
</head>
<body>

<h1>My Calculator 🧮</h1>

<button onclick="document.body.classList.toggle('dark')" style="padding:10px 20px;border-radius:10px;cursor:pointer;">🌙 Dark Mode</button>

<div class="calc-box">
<input type="text" id="display" readonly placeholder="0">

<div class="buttons">
<button class="red" onclick="clearDisplay()">C</button>
<button onclick="backspace()">⌫</button>
<button onclick="addToDisplay('%')">%</button>
<button class="orange" onclick="addToDisplay('/')">÷</button>

<button onclick="addToDisplay('7')">7</button>
<button onclick="addToDisplay('8')">8</button>
<button onclick="addToDisplay('9')">9</button>
<button class="orange" onclick="addToDisplay('*')">×</button>

<button onclick="addToDisplay('4')">4</button>
<button onclick="addToDisplay('5')">5</button>
<button onclick="addToDisplay('6')">6</button>
<button class="orange" onclick="addToDisplay('-')">-</button>

<button onclick="addToDisplay('1')">1</button>
<button onclick="addToDisplay('2')">2</button>
<button onclick="addToDisplay('3')">3</button>
<button class="orange" onclick="addToDisplay('+')">+</button>

<button onclick="addToDisplay('0')">0</button>
<button onclick="addToDisplay('00')">00</button>
<button onclick="addToDisplay('.')">.</button>
<button class="blue" onclick="calculate()">=</button>
</div>
</div>

<a href="index.html">⬅ Back to Home</a>

<script>
function addToDisplay(value){
  document.getElementById('display').value += value;
}
function clearDisplay(){
  document.getElementById('display').value = '';
}
function backspace(){
  let d = document.getElementById('display');
  d.value = d.value.slice(0, -1);
}
function calculate(){
  let d = document.getElementById('display');
  try{
    d.value = eval(d.value);
  }catch{
    d.value = 'Error';
  }
}
</script>

</body>
</html>
