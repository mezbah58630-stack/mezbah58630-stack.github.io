<!DOCTYPE html>
<html>
<head>
<title>Weather App 🌤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{ font-family: Arial, sans-serif; background: linear-gradient(135deg,#4facfe,#00f2fe); text-align: center; margin: 0; padding: 20px; min-height: 100vh; }
.card{ background: white; max-width: 380px; margin: 20px auto; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
input{ padding: 12px; width: 70%; border-radius: 10px; border: 2px solid #ddd; font-size: 16px; }
button{ padding: 12px 20px; background: #2196f3; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; margin-top: 10px; }
#icon{ font-size: 80px; margin: 10px; }
#temp{ font-size: 55px; font-weight: bold; margin: 5px; }
#desc{ font-size: 20px; color: #555; }
.info{ display: flex; justify-content: space-around; margin-top: 20px; background: #f0f8ff; padding: 15px; border-radius: 12px; }
.info div{ text-align: center; }
.info b{ display: block; font-size: 18px; }
a{ display: inline-block; margin-top: 15px; background: #333; color: white; padding: 10px 20px; border-radius: 10px; text-decoration: none; }
body.dark{ background: #1a1a1a; }
body.dark .card{ background: #2d2d2d; color: white; }
body.dark #desc{ color: #ccc; }
body.dark .info{ background: #3d3d3d; color: white; }
</style>
</head>
<body>

<h1 style="color:white;">Weather App 🌤️</h1>
<button onclick="document.body.classList.toggle('dark')" style="background:white;color:#333;padding:10px 20px;border-radius:10px;cursor:pointer;">🌙 Dark Mode</button>

<div class="card">
  <input id="city" placeholder="Enter city - e.g. Dhaka" value="Dhaka">
  <br>
  <button onclick="getWeather()">🔍 Search Weather</button>
  <button onclick="getMyLocation()" style="background:#4caf50;">📍 My Location</button>
  <div id="result">
    <div id="icon">🌤️</div>
    <div id="temp">--°C</div>
    <div id="desc">Search a city to see weather</div>
    <div id="cityName" style="font-weight:bold;margin-top:5px;"></div>
    <div class="info">
      <div>💧 Humidity<b id="hum">--%</b></div>
      <div>💨 Wind<b id="wind">-- km/h</b></div>
      <div>🌡️ Feels<b id="feels">--°C</b></div>
    </div>
  </div>
</div>

<a href="index.html">⬅ Back to Home</a>

<script>
function getIcon(code){
  if(code===0) return '☀️';
  if(code<=2) return '🌤️';
  if(code===3) return '☁️';
  if(code<=48) return '🌫️';
  if(code<=67) return '🌧️';
  if(code<=77) return '❄️';
  if(code<=82) return '🌧️';
  return '⛈️';
}
function getDesc(code){
  if(code===0) return 'Clear Sky';
  if(code===1) return 'Mainly Clear';
  if(code===2) return 'Partly Cloudy';
  if(code===3) return 'Overcast';
  if(code<=48) return 'Foggy';
  if(code<=67) return 'Rainy';
  if(code<=77) return 'Snowy';
  if(code<=82) return 'Rain Showers';
  return 'Thunderstorm';
}
async function fetchWeather(lat, lon, name){
  document.getElementById('desc').innerText = 'Loading...';
  let url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m`;
  let res = await fetch(url);
  let data = await res.json();
  let c = data.current;
  document.getElementById('icon').innerText = getIcon(c.weather_code);
  document.getElementById('temp').innerText = Math.round(c.temperature_2m) + '°C';
  document.getElementById('desc').innerText = getDesc(c.weather_code);
  document.getElementById('cityName').innerText = '📍 ' + name;
  document.getElementById('hum').innerText = c.relative_humidity_2m + '%';
  document.getElementById('wind').innerText = Math.round(c.wind_speed_10m) + ' km/h';
  document.getElementById('feels').innerText = Math.round(c.apparent_temperature) + '°C';
}
async function getWeather(){
  let city = document.getElementById('city').value;
  if(!city) return alert('Type a city name!');
  let geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=en&format=json`);
  let gdata = await geo.json();
  if(!gdata.results) return alert('City not found! Try another.');
  let place = gdata.results[0];
  fetchWeather(place.latitude, place.longitude, place.name + ', ' + (place.country || ''));
}
function getMyLocation(){
  if(!navigator.geolocation) return alert('Location not supported');
  navigator.geolocation.getCurrentPosition(pos => {
    fetchWeather(pos.coords.latitude, pos.coords.longitude, 'Your Location');
  });
}
getWeather();
</script>

</body>
</html>
